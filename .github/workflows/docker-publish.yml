name: Build and Publish Docker Image

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: docker.io
  IMAGE_NAME: nanandre/veillebot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check Docker Hub secrets
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        echo "Checking Docker Hub configuration..."
        echo "Available secrets (debug):"
        echo "DOCKER_USERNAME length: ${#DOCKER_USERNAME}"
        echo "DOCKER_PASSWORD length: ${#DOCKER_PASSWORD}"
        
        if [ -z "$DOCKER_USERNAME" ]; then
          echo "DOCKER_USERNAME secret is missing or empty"
          echo "→ Go to: https://github.com/${{ github.repository }}/settings/secrets/actions"
          echo "→ Add secret named exactly: DOCKER_USERNAME"
          echo "→ Value should be: nanandre"
          exit 1
        else
          echo " DOCKER_USERNAME is configured: $DOCKER_USERNAME"
        fi
        
        if [ -z "$DOCKER_PASSWORD" ]; then
          echo " DOCKER_PASSWORD secret is missing or empty" 
          echo "→ Add DOCKER_PASSWORD in GitHub repository secrets"
          echo "→ Use a Docker Hub access token, not your password"
          exit 1
        else
          echo " DOCKER_PASSWORD is configured (token format check...)"
          if [[ $DOCKER_PASSWORD == dckr_pat_* ]]; then
            echo " Token format is correct"
          else
            echo " Token doesn't start with 'dckr_pat_' - verify it's an access token"
          fi
        fi
        
        echo "Docker Hub secrets verification passed"

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Image digest
      if: github.event_name != 'pull_request'
      run: echo "Image pushed successfully to Docker Hub"
